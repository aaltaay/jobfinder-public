# SmartRecruiters: public no-auth `postings` endpoint; unknown company slugs
# resolve to 200 + empty content (no board-error path needed), so entries are
# safe to include speculatively. company identifiers verified via curl.
smartrecruiters:
  - visa
  - smartrecruiters

# Workable: public `?details=true` widget endpoint. Account slugs verified via
# curl to have real, current job postings.
workable:
  - allucent
  - walletconnect
  - huggingface
  - doist
  - typeform

# Recruitee: public `/api/offers/` endpoint. Recruitee skews EU/on-site, so
# yield against a US-only profile is expected to be low — kept for coverage.
recruitee:
  - veocareers
  - blocktech
  - justrussel

# Teamtailor: NOT the documented JSON:API (`api.teamtailor.com/v1/jobs`) which
# requires a per-tenant API key — instead the no-auth public `jobs.json`
# JSON Feed every career site exposes (see collectors/teamtailor.py). Subdomains
# verified via curl.
teamtailor:
  - polestar
  - storytel
  - fishbrain
  - doconomy
  - podimo

# Workday CXS: POST-only public API, hard-capped at 20 results/page. Every
# {tenant, wd, site} triple below was verified via a live curl POST — do not
# add unverified triples (wrong `wd` datacenter number or `site` name returns
# 422, not a graceful empty list).
workday:
  - tenant: nvidia
    wd: wd5
    site: NVIDIAExternalCareerSite
  - tenant: salesforce
    wd: wd12
    site: External_Career_Site
  - tenant: capitalone
    wd: wd12
    site: Capital_One
  - tenant: target
    wd: wd5
    site: targetcareers
  - tenant: pfizer
    wd: wd1
    site: PfizerCareers
  - tenant: comcast
    wd: wd5
    site: Comcast_Careers
  - tenant: workday
    wd: wd5
    site: Workday

feeds:
  remoteok: true
  remotive: true
  arbeitnow: true
  themuse: true
  jobicy: true
  # Adzuna requires ADZUNA_APP_ID / ADZUNA_APP_KEY (not yet provisioned — see
  # docs/SOURCE-PINS.md). The collector skips gracefully when unset, so this
  # toggle can stay on.
  adzuna: true
  # HN "Who is hiring?" is freeform text, not a structured job API — kept
  # experimental/opt-in like JobSpy until the extraction heuristics prove out.
  hn_whoishiring: false

schedule:
  ats_every_run: true
  feeds_once_daily: true
