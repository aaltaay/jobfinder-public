name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  jobfinder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/jobfinder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/jobfinder/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:exports

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Agent contract (public export mode)
        run: py -3 tools/agent_contract.py --ci-public
